name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow runs these tests on the tag first.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      mariadb:
        image: mariadb:11
        env:
          MYSQL_USER: dox
          MYSQL_PASSWORD: password
          MYSQL_DATABASE: dox-framework
          MYSQL_ROOT_PASSWORD: password
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s --health-retries 30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      PG_PORT: 5432
      MYSQL_PORT: 3306
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # The other Dox packages come from their newest code (main, or the
      # branch with the same name as this PR), not pub.dev. On a tag it
      # does nothing. See the script.
      - run: ci/use-siblings.sh
      # Caches the Rust dependencies of the native packages.
      - uses: Swatinem/rust-cache@v2
        if: github.ref_type != 'tag'
        with:
          workspaces: |
            ../dox-http-native/native -> target
            ../dox-postgres-native/native -> target
            ../dox-mysql-native/native -> target
      # Builds the native libraries of the clones, for this machine only.
      - run: ci/use-siblings.sh build
      # CI only: the sqlite3 hook uses the runner's SQLite, no download.
      - run: ci/system-sqlite.sh pubspec.yaml
      # Pub workspace: one `dart pub get` at the root links all packages.
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos packages
      - name: Publish order
        run: ci/publish-order.sh
      - name: Check that all package versions match the root version
        run: ci/check-versions.sh
      - name: Test dox_queue
        working-directory: packages/dox-queue
        run: dart test
      - name: Test dox_queue_database
        working-directory: packages/dox-queue-database
        run: dart test
      # Takes the CI-only hooks block out again. It must not be published.
      - run: git checkout pubspec.yaml
      - name: Dry run publish
        run: ci/publish-dry-run.sh
