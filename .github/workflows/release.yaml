name: Release

# Push a tag like v<version> to publish dox_queue and dox_queue_database
# to pub.dev, in dependency order. A package that is already on pub.dev
# with this version is skipped, so a failed release can be run again. The
# tag must match the root pubspec version and be on main.
# Wait for CI to be green on main before you push the tag. Then the tag
# skips the tests: they already passed on this commit (ci-passed). If CI
# did not pass on main, the tag runs the tests again, on pub.dev only.
# pub-check always runs: main CI used the sibling clones, so it checks the
# packages against what is really on pub.dev.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # passed=true when CI passed on main for this same commit. Any API error
  # or unclear answer gives false, so the tests run.
  ci-passed:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?event=push&branch=main&status=success&head_sha=$GITHUB_SHA" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .head_sha == env.GITHUB_SHA)] | length') || n=0
          if [ "$n" -gt 0 ] 2>/dev/null; then passed=true; else passed=false; fi
          echo "passed=$passed" | tee -a "$GITHUB_OUTPUT"

  # The CI tests, when they did not pass on main yet. On a tag they use
  # pub.dev only. `!cancelled()`: run even if ci-passed itself failed.
  test:
    needs: ci-passed
    if: ${{ !cancelled() && needs.ci-passed.outputs.passed != 'true' }}
    uses: ./.github/workflows/ci.yaml

  # Short check against pub.dev only, on every tag. Read access only: it
  # runs no upload, so it does not get the pub.dev token.
  pub-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: ci/pub-get-retry.sh
      - run: dart analyze --no-fatal-warnings packages

  # A skipped test job is fine only when CI passed on main. A failed or
  # cancelled test job stops the release.
  publish:
    needs: [ci-passed, test, pub-check]
    if: >-
      ${{ !cancelled()
      && needs.pub-check.result == 'success'
      && (needs.test.result == 'success'
      || (needs.test.result == 'skipped' && needs.ci-passed.outputs.passed == 'true')) }}
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # pub.dev automated publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tag is not on main"; exit 1; }
      # Folder:package, in publish order. Sets PACKAGES for the next steps.
      - name: Publish order
        run: ci/publish-order.sh
      - name: Check that tag and all package versions match the root version
        run: ci/check-versions.sh
      # Sets up the OIDC token for pub.dev. No secret needed.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # Check every package before anything is uploaded. The workspace links
      # the local packages, so this needs no wait for pub.dev. The uploads
      # then skip this check (--skip-validation), see ci/publish.sh.
      - name: Resolve the workspace
        run: ci/pub-get-retry.sh
      - name: Check every package (dry run)
        run: ci/publish-dry-run.sh
      - name: Publish packages in order
        run: ci/publish.sh
