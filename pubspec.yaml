name: dox_queue
description: "Background jobs for the Dox framework: Redis, database and sync drivers, retries, delays and workers."
version: 3.1.0
repository: https://github.com/dartondox/dox-queue
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0

dependencies:
  analyzer: ^14.6.0
  build: ^5.0.0
  dart_style: ^3.1.14
  dox_core: ^3.1.0
  dox_mailer: ^3.1.0
  dox_orm: ^3.1.0
  dox_scheduler: ^3.1.0
  glob: ^2.2.0
  ioredis: ^3.0.2

dev_dependencies:
  build_test: ^3.5.23
  lints: ^6.1.0
  test: ^1.33.0

# The `dox` CLI finds the commands of this package here (`dox queue:table`).
dox:
  commands: package:dox_queue/commands.dart
