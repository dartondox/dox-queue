name: dox_queue_workspace
publish_to: 'none'
# All packages in packages/ share this version. Change it here, then run
# bin/update_versions.sh.
version: 3.2.1

environment:
  sdk: ^3.13.0

# Dart pub workspace: one `dart pub get` at the root links all packages
# and writes one pubspec.lock.
workspace:
  - packages/dox-queue
  - packages/dox-queue-database
