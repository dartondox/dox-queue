name: dox_queue_database
description: "The database driver for dox_queue: jobs, failed jobs and batches in your SQLite, Postgres or MySQL database, and afterCommit dispatch."
version: 3.1.0
repository: https://github.com/dartondox/dox-queue
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  # Raise to the dox_annotation release that has command.dart before
  # releasing this package.
  dox_annotation: ^3.1.3
  dox_orm: ^3.1.0
  dox_queue: ^3.1.0

dev_dependencies:
  dox_core: ^3.1.0
  lints: ^6.1.0
  test: ^1.33.0

# The `dox` CLI finds the commands of this package here (`dox queue:table`).
dox:
  commands: package:dox_queue_database/commands.dart
