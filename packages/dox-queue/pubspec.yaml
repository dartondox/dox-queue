name: dox_queue
description: "Background jobs for the Dox framework: Redis and sync drivers, retries, delays, chains, batches and workers."
version: 3.2.0
repository: https://github.com/dartondox/dox-queue
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  dox_core: ^3.2.0
  dox_annotation: ^3.2.0
  ioredis: ^3.2.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0

# The `dox` CLI finds the commands of this package here (`dox queue:install`).
dox:
  commands: package:dox_queue/commands.dart
