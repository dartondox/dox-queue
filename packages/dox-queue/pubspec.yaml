name: dox_queue
description: "Background jobs for the Dox framework: Redis and sync drivers, retries, delays, chains, batches and workers."
version: 3.1.0
repository: https://github.com/dartondox/dox-queue
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  # Raise to the dox_core release that runs DoxProvider.boot() before
  # releasing this package.
  dox_core: ^3.1.0
  # Raise to the dox_annotation release that has install.dart before
  # releasing this package.
  dox_annotation: ^3.1.3
  ioredis: ^3.0.2

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0

# The `dox` CLI finds the commands of this package here (`dox queue:install`).
dox:
  commands: package:dox_queue/commands.dart
